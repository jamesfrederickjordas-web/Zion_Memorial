<div id="loginModal" class="modal">
    <div class="modal-arrow"></div> 
    <div class="modal-content">
        <span class="close-btn login-close">&times;</span>
        <div class="portal-login">
            <img src="assets/images/logos/assetslogo.png" alt="Logo" class="portal-logo">
            <h3>ZION MEMORIAL GARDEN</h3>
            <div id="loginPanel">
                <p class="portal-subtitle">PORTAL LOGIN</p>
                <hr>
                <form id="loginForm">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    
                    <label>Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                        <img src="assets/images/icons/image 66.png" alt="Toggle View" class="login-eye-icon">
                    </div>
                    
                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember Me</span>
                        </label>
                        <a href="#" id="forgotPasswordLink" class="forgot-pass">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="portal-submit">Login</button>
                </form>
                <p class="register-link">Don't have an account? <a href="#" id="showRegisterLink">Register now</a></p>
            </div>

            <div id="forgotPasswordPanel" style="display: none;">
                <p class="portal-subtitle">RESET PASSWORD</p>
                <hr>
                <p class="forgot-desc">Enter your email address and we'll send a verification link to your Gmail / inbox to change your password.</p>
                <form id="forgotPasswordForm">
                    <label>Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
                    <div id="forgotPasswordStatus" class="forgot-status" style="display: none;"></div>
                    <button type="submit" class="portal-submit" id="forgotSubmitBtn">Send Reset Link</button>
                </form>
                <p class="register-link"><a href="#" id="backToLoginLink">&larr; Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
