<div class="change-password-container">
    <div class="change-password-header">
        <h2>Change Password</h2>
        <button type="button" class="close-change-password" id="closeChangePasswordBtn">&times;</button>
    </div>

    <form id="changePasswordForm" class="change-password-form">
        <div class="form-group">
            <label for="currentPasswordInput">Current / Past Password *</label>
            <div class="password-input-wrap">
                <input type="password" id="currentPasswordInput" placeholder="Enter your current password" required autocomplete="current-password">
                <button type="button" class="toggle-pwd-btn" data-target="currentPasswordInput" tabindex="-1">Show</button>
            </div>
            <small class="pwd-hint">Enter the password you currently use to sign in.</small>
        </div>

        <div class="form-group">
            <label for="newPasswordInput">New Password *</label>
            <div class="password-input-wrap">
                <input type="password" id="newPasswordInput" placeholder="Enter new password (min. 6 characters)" required autocomplete="new-password">
                <button type="button" class="toggle-pwd-btn" data-target="newPasswordInput" tabindex="-1">Show</button>
            </div>
            <small class="pwd-hint">Must be at least 6 characters and different from your current password.</small>
        </div>

        <div class="form-group">
            <label for="confirmPasswordInput">Confirm New Password *</label>
            <div class="password-input-wrap">
                <input type="password" id="confirmPasswordInput" placeholder="Re-enter your new password" required autocomplete="new-password">
                <button type="button" class="toggle-pwd-btn" data-target="confirmPasswordInput" tabindex="-1">Show</button>
            </div>
            <small class="pwd-hint">Must match your new password exactly.</small>
        </div>

        <div id="changePasswordErrorMsg" class="change-pwd-error" style="display: none;"></div>

        <div class="form-actions">
            <button type="button" class="cancel-pwd-btn" id="cancelChangePasswordBtn">Cancel</button>
            <button type="submit" class="save-pwd-btn" id="saveChangePasswordBtn">Update Password</button>
        </div>
    </form>
</div>
